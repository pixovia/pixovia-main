<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pixovia adult - File Sharing Platform</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📁</text></svg>">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <h1 class="logo">pixovia adult</h1>
                <button class="btn btn-primary" id="uploadBtn">Upload File</button>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <!-- Search and Filter Section -->
            <div class="search-section">
                <input type="text" id="searchInput" class="search-input" placeholder="Search files...">
                <select id="sortSelect" class="sort-select">
                    <option value="newest">Newest First</option>
                    <option value="oldest">Oldest First</option>
                    <option value="popular">Most Popular</option>
                    <option value="featured">Featured</option>
                </select>
            </div>

            <!-- Loading State -->
            <div id="loadingState" class="loading">
                <div class="spinner"></div>
                <p>Loading files...</p>
            </div>

            <!-- Files Grid -->
            <div id="filesGrid" class="files-grid"></div>

            <!-- Empty State -->
            <div id="emptyState" class="empty-state" style="display: none;">
                <p>No files found. Be the first to upload!</p>
            </div>
        </div>
    </main>

    <!-- Upload Modal -->
    <div id="uploadModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Upload New File</h2>
                <button class="close-btn" id="closeModal">&times;</button>
            </div>
            <form id="uploadForm" class="upload-form">
                <div class="form-group">
                    <label for="fileTitle">Title *</label>
                    <input type="text" id="fileTitle" required>
                </div>
                <div class="form-group">
                    <label for="fileDescription">Description</label>
                    <textarea id="fileDescription" rows="4"></textarea>
                </div>
                <div class="form-group">
                    <label for="fileUrl">File URL *</label>
                    <input type="url" id="fileUrl" required placeholder="https://example.com/file.jpg">
                </div>
                <div class="form-group">
                    <label for="thumbnailUrl">Thumbnail URL</label>
                    <input type="url" id="thumbnailUrl" placeholder="https://example.com/thumb.jpg">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="authorName">Author Name *</label>
                        <input type="text" id="authorName" required>
                    </div>
                    <div class="form-group">
                        <label for="authorEmail">Author Email</label>
                        <input type="email" id="authorEmail">
                    </div>
                </div>
                <div class="form-group">
                    <label for="fileTags">Tags (comma separated)</label>
                    <input type="text" id="fileTags" placeholder="art, design, photo">
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Upload</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
