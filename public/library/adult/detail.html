<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Details - pixovia adult</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📁</text></svg>">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <h1 class="logo"><a href="index.html">pixovia adult</a></h1>
                <a href="index.html" class="btn btn-secondary">Back to Gallery</a>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div id="loadingState" class="loading">
                <div class="spinner"></div>
                <p>Loading file details...</p>
            </div>

            <div id="fileDetail" class="file-detail" style="display: none;">
                <!-- File Media -->
                <div class="file-media">
                    <img id="fileImage" src="" alt="" class="file-image">
                    <video id="fileVideo" src="" controls class="file-video" style="display: none;"></video>
                    <iframe id="fileIframe" src="" class="file-iframe" style="display: none;"></iframe>
                </div>

                <!-- File Info -->
                <div class="file-info">
                    <div class="file-header">
                        <h1 id="fileTitle" class="file-title"></h1>
                        <div class="file-stats">
                            <span class="stat-item">
                                <span class="stat-icon">👁️</span>
                                <span id="viewsCount">0</span> views
                            </span>
                            <span class="stat-item">
                                <span class="stat-icon">❤️</span>
                                <span id="likesCount">0</span> likes
                            </span>
                        </div>
                    </div>

                    <p id="fileDescription" class="file-description"></p>

                    <div class="file-tags" id="fileTags"></div>

                    <!-- Author Info -->
                    <div class="author-section">
                        <div class="author-avatar">
                            <img id="authorAvatar" src="" alt="" onerror="this.style.display='none'">
                            <div class="author-initials" id="authorInitials"></div>
                        </div>
                        <div class="author-info">
                            <h3 id="authorName" class="author-name"></h3>
                            <p id="authorBio" class="author-bio"></p>
                            <p id="authorEmail" class="author-email"></p>
                        </div>
                    </div>

                    <div class="file-meta">
                        <p class="meta-item">
                            <strong>Uploaded:</strong> <span id="createdAt"></span>
                        </p>
                        <p class="meta-item">
                            <strong>File Type:</strong> <span id="fileType"></span>
                        </p>
                        <div class="file-actions">
                            <a id="fileUrl" href="" target="_blank" class="btn btn-primary">View Original</a>
                            <a id="downloadBtn" href="" download class="btn btn-secondary">Download</a>
                        </div>
                    </div>
                </div>
            </div>

            <div id="errorState" class="error-state" style="display: none;">
                <p>File not found or error loading file details.</p>
                <a href="index.html" class="btn btn-primary">Go Back</a>
            </div>
        </div>
    </main>

    <script src="detail.js"></script>
</body>
</html>
