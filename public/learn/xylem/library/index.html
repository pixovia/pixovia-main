            </div>

                    <h3 class="text-sm lg:text-base font-bold text-gray-800">Biology</h3>

                </div>

    <nav class="lg:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 flex justify-around items-center py-2 z-20">
        <div class="flex flex-col items-center p-2 text-gray-400" onclick="location.href='../index.html'">

        <div class="flex flex-col items-center p-2 text-gray-400" onclick="location.href='../batches/index.html'">
            <img src="https://www.xylem.live/assets/hamburger/batches.svg">

        <div class="flex flex-col items-center p-2 text-gray-400">
            <i class="fa-solid fa-cart-shopping text-lg"></i>
            <span class="text-[9px] mt-1 font-medium">Xylem Store</span>
        </div>
        <div class="flex flex-col items-center p-2 text-teal-600">
            <i class="fa-solid fa-book-open text-lg"></i>
            <span class="text-[9px] mt-1 font-bold">Library</span>
        </div>
    </nav>

    <script>
    // Select elements
    const menuBtn = document.querySelector('.fa-bars');
    const sidebar = document.querySelector('aside nav');

    // Initially hide the nav on mobile
    sidebar.classList.add('hidden', 'lg:block');

    // Toggle the sidebar when hamburger is clicked
    menuBtn.addEventListener('click', () => {
        sidebar.classList.toggle('hidden');
    });
</script>


</body>
</html>
