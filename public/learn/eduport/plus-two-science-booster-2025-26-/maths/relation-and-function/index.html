<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eduport - Lessons</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background-color: #F8F9FD;
    }

    .header-gradient {
      background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
    }

    .maths-icon-blur {
      background-color: #ffffff22;
      backdrop-filter: blur(4px);
      border-radius: 12px;
      padding: 8px;
    }

    .lesson-dot-connector {
      position: relative;
    }

    .lesson-dot-connector::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 100%;
      width: 2px;
      height: 16px;
      background: #e5e7eb;
      transform: translateX(-50%);
    }

    .lesson-dot-connector.last::after {
      display: none;
    }
  </style>
</head>
<body class="min-h-screen">

  <!-- LESSON LIST PAGE -->
  <div id="page-lessons">
    <!-- Header Section -->
    <div class="header-gradient text-white p-6 md:p-10">
      <div class="max-w-4xl mx-auto flex items-center justify-between">
        <div class="flex items-center">
          <button class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center mr-4">
            <i class="fa-solid fa-arrow-left"></i>
          </button>
          <h1 class="text-xl font-bold">Relations and Functions</h1>
        </div>
        <div class="maths-icon-blur w-12 h-12 flex items-center justify-center">
          <img src="https://assets.eduport.app/media/assets/Maths_Basics_Image0821143717qynbnk.png"
               class="w-full h-full object-contain" alt="Maths">
        </div>
      </div>
    </div>

    <!-- Lesson List -->
    <main class="max-w-4xl mx-auto px-4 -mt-4 mb-20">
      <div class="bg-white rounded-t-[32px] shadow-sm border border-gray-100 overflow-hidden">
        <!-- Title Row -->
        <div class="flex items-center p-6 border-b">
          <div class="w-10 h-10 rounded-full bg-indigo-900 text-white flex items-center justify-center font-bold mr-4">1</div>
          <h2 class="text-lg font-bold text-gray-800 flex-1">Relations and Functions</h2>
        </div>

        <!-- Lesson List Items -->
        <div class="p-6 space-y-4">
          <!-- Lesson 1 -->
          <div class="flex items-start">
            <div class="mr-4 pt-2">
              <div class="w-6 h-6 rounded-full border-2 border-indigo-400 flex items-center justify-center bg-white z-10 lesson-dot-connector">
                <i class="fa-solid fa-play text-[8px] text-indigo-500"></i>
              </div>
            </div>
            <div class="flex-1 bg-blue-50/50 p-4 rounded-2xl flex items-center justify-between cursor-pointer hover:bg-blue-100 transition"
                 onclick="window.location.href='https://pixovia.pages.dev/learn/eduport/player/?id=21641&note=https://assets.eduport.app/media/video/attachment/P2BFT_M1_T1_V11127125144scmlcb.pdf&quiz=https://eduport.app/quiz'">
              <span class="font-medium text-gray-700">1 . Relations</span>
              <span class="text-xs font-bold text-gray-500 bg-white px-3 py-1 rounded-full border">14:24</span>
            </div>
          </div>

          <!-- Lesson 2 -->
          <div class="flex items-start">
            <div class="mr-4 pt-2">
              <div class="w-6 h-6 rounded-full border-2 border-gray-300 flex items-center justify-center bg-white z-10 lesson-dot-connector">
                <i class="fa-solid fa-play text-[8px] text-gray-400"></i>
              </div>
            </div>
            <div class="flex-1 bg-gray-50 p-4 rounded-2xl flex items-center justify-between opacity-80">
              <span class="font-medium text-gray-400">2 . Domain and Range</span>
              <span class="text-xs font-bold text-gray-400 bg-white px-3 py-1 rounded-full border">10:12</span>
            </div>
          </div>

          <!-- Lesson 3 -->
          <div class="flex items-start">
            <div class="mr-4 pt-2">
              <div class="w-6 h-6 rounded-full border-2 border-gray-300 flex items-center justify-center bg-white z-10 lesson-dot-connector last">
                <i class="fa-solid fa-play text-[8px] text-gray-400"></i>
              </div>
            </div>
            <div class="flex-1 bg-gray-50 p-4 rounded-2xl flex items-center justify-between opacity-80">
              <span class="font-medium text-gray-400">3 . Graph of Relations</span>
              <span class="text-xs font-bold text-gray-400 bg-white px-3 py-1 rounded-full border">09:30</span>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

</body>
</html>
