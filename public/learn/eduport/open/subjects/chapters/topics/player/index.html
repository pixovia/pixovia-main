<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eduport | Pixovia Learn Player </title>
    <meta name="robots" content="noindex, nofollow">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/gh/voltnexis/player/dist/assets/main.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/gh/voltnexis/player/dist/player.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f9fafb;
    }
    .video-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }
    .quality-btn {
      background-color: #f3f4f6;
      color: #374151;
      border-radius: 8px;
      padding: 6px 12px;
      font-weight: 600;
      font-size: 0.8rem;
      transition: all 0.2s;
    }
    .quality-btn:hover {
      background-color: #e5e7eb;
    }
    .quality-btn.active {
      background-color: #3b82f6;
      color: white;
    }
  </style>
</head>

<body class="min-h-screen flex flex-col items-center">

  <!-- Header -->
  <header class="w-full max-w-5xl flex items-center justify-between px-4 py-4 bg-white border-b shadow-sm rounded-b-3xl mb-6">
    <div class="flex items-center space-x-3">
      <img src="https://media.licdn.com/dms/image/v2/D560BAQEJe_G69SfZXA/company-logo_200_200/company-logo_200_200/0/1731746328968?e=2147483647&v=beta&t=i6VRtIcoqeb3nRbsqcj4KPnMuQ5AB_f81Ww18jQUGXQ"
           class="w-8 h-8 rounded-full object-cover" />
      <div class="w-px h-5 bg-gray-300"></div>
      <img src="https://pixovia.pages.dev/icon-coloured-closeup.jpg"
           class="w-8 h-8 rounded-full object-cover" />
      <span class="text-gray-800 font-semibold text-lg ml-1">Learn</span>
    </div>
    <button onclick="window.history.back()" class="text-gray-600 hover:text-indigo-600">
      <i class="fa-solid fa-arrow-left mr-1"></i> Back
    </button>
  </header>

  <!-- Main Content -->
  <main class="w-full max-w-4xl p-4 space-y-6">
    <!-- Title -->
    <h1 id="lessonTitle" class="text-xl font-bold text-gray-800 text-center mb-4">Loading...</h1>

    <!-- Video -->
    <div class="video-container" id="player-wrapper"></div>

    <!-- Notes + DPP -->
    <div class="bg-white p-6 rounded-2xl shadow-sm flex flex-col sm:flex-row items-center justify-between gap-4">
      <a id="noteLink"
         href="#"
         target="_blank"
         class="hidden flex items-center justify-center w-full sm:w-auto bg-blue-50 text-blue-700 font-semibold px-6 py-3 rounded-xl hover:bg-blue-100 transition">
        <i class="fa-solid fa-paperclip mr-2"></i> Download Notes
      </a>
      <a id="mp4Link"
         href="#"
         target="_blank"
         class="hidden w-full sm:w-auto bg-green-600 hover:bg-green-700 text-white font-bold px-5 py-2 rounded-lg shadow transition-all active:scale-95 text-center">
         ⬇ Download Video
      </a>
      <a id="dppLink"
         href="#"
         target="_blank"
         class="hidden w-full sm:w-auto bg-[#FF6D33] hover:bg-[#E65A22] text-white font-bold px-10 py-3 rounded-xl shadow-lg shadow-orange-200 transition-all active:scale-95 text-center">
         📘 DPP Sheet
      </a>
    </div>
  </main>

<!-- voltnexis Player Script -->


<script>
  const playerWrapper = document.getElementById('player-wrapper');
  const noteLink = document.getElementById('noteLink');
  const dppLink = document.getElementById('dppLink');
  const mp4Link = document.getElementById('mp4Link');
  const titleEl = document.getElementById('lessonTitle');

  // 🎯 Session डेटा
  const topic = sessionStorage.getItem('topic');
  const hlsUrl = sessionStorage.getItem('class');   // main .m3u8
  const mp4Url = sessionStorage.getItem('class2');  // backup mp4
  const ytUrl = sessionStorage.getItem('class3');   // youtube
  const noteUrl = sessionStorage.getItem('note');
  const dppUrl = sessionStorage.getItem('dpp');

  titleEl.textContent = topic || "Untitled Lesson";

  // 📎 Notes & DPP
  if (noteUrl) {
    noteLink.href = noteUrl;
    noteLink.classList.remove('hidden');
  }
  if (dppUrl) {
    dppLink.href = dppUrl;
    dppLink.classList.remove('hidden');
  }
  if (mp4Url) {
    mp4Link.href = mp4Url;
    mp4Link.classList.remove('hidden');
  }
    
  async function loadHlsWithQualities(masterUrl) {
  try {
    const res = await fetch(masterUrl);
    const text = await res.text();

    const base = masterUrl.substring(0, masterUrl.lastIndexOf("/") + 1);

    const lines = text.split("\n");

    let qualities = {};
    let currentResolution = null;

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];

      if (line.includes("RESOLUTION=")) {
        const match = line.match(/RESOLUTION=\d+x(\d+)/);
        if (match) {
          currentResolution = match[1]; // 720, 480 etc
        }
      }

      if (line && !line.startsWith("#") && currentResolution) {
        qualities[currentResolution] = base + line.trim();
        currentResolution = null;
      }
    }

    // 🧠 Build vn-player dynamically
    let attrs = `
      src="${masterUrl}"
      auto="${masterUrl}"
      title="${topic || 'Video'}"
      progress-color="#F56D16"
      hide="subtitle,theater,preview,share,comment,like,dislike,chat"
    `;

    Object.keys(qualities).forEach(q => {
      attrs += ` quality-${q}="${qualities[q]}"`;
    });

    playerWrapper.innerHTML = `<voltnexis-player ${attrs}></voltnexis-player>`;

  } catch (err) {
    console.error("M3U8 parse failed:", err);
    playerWrapper.innerHTML = "❌ Failed to load video";
  }
}

  // 🎬 PLAYER LOADER (PRIORITY BASED)
  function loadPlayer() {
    playerWrapper.innerHTML = "";

    // ✅ 1. HLS (MASTER M3U8 → auto quality)
    if (hlsUrl && hlsUrl.endsWith(".m3u8")) {
      loadHlsWithQualities(hlsUrl);
      return;
    }

    // ✅ 2. MP4 FALLBACK
    if (mp4Url && (mp4Url.endsWith(".mp4") || mp4Url.endsWith(".m4v"))) {
      playerWrapper.innerHTML = `
        <video 
          src="${mp4Url}" 
          controls 
          autoplay 
          class="w-full h-full rounded-2xl bg-black">
        </video>

        <div class="mt-3 text-center">
          <a href="${mp4Url}" download 
             class="bg-green-600 text-white px-4 py-2 rounded-lg font-semibold">
             ⬇ Download Video
          </a>
        </div>
      `;
      return;
    }

    // ✅ 3. YOUTUBE FALLBACK
    if (ytUrl) {
      const embed = ytUrl
        .replace("watch?v=", "embed/")
        .replace("youtu.be/", "www.youtube.com/embed/");

      playerWrapper.innerHTML = `
        <iframe 
          src="${embed}" 
          class="w-full h-full rounded-2xl"
          frameborder="0" 
          allowfullscreen>
        </iframe>
      `;
      return;
    }

    // ❌ NOTHING AVAILABLE
    playerWrapper.innerHTML =
      '<div class="flex items-center justify-center h-full text-white">❌ No video source available</div>';
  }

  // 🚀 INIT
  loadPlayer();
</script>
</body>
</html>
